<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914;color:#d7faff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none;padding:25px 20px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:start}.brand{font-size:24px;font-weight:900;letter-spacing:5px;text-shadow:0 0 25px #00dfff}.sub{font-size:10px;letter-spacing:3px;color:#6f9baa;margin-top:6px}.status{font:11px monospace;color:#8bf9d3;text-align:right}.bottom{pointer-events:auto;background:linear-gradient(180deg,#091728dd,#050d18f5);border:1px solid #28536a;border-radius:18px;padding:15px;box-shadow:0 0 35px #00bfff19}.row{display:flex;gap:8px;margin-top:12px}button{flex:1;border:1px solid #30667a;background:#0a2334;color:#aeeeff;border-radius:9px;padding:13px 4px;font-size:11px;letter-spacing:1px;font-weight:bold}button.active{background:#00bcd4;color:#02131b;box-shadow:0 0 18px #00bcd488}.label{font-size:11px;letter-spacing:2px;color:#85b4c3;display:flex;justify-content:space-between}input{width:100%;accent-color:#00e5ff;margin:14px 0 5px}.foot{font:10px monospace;color:#608b9a;text-align:center;margin-top:10px}#hint{position:absolute;top:48%;width:100%;text-align:center;color:#6b9aab;letter-spacing:3px;font-size:10px;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div id="hint">TOUCH THE WATER TO SCATTER THE FISH</div><div class="hud"><div class="top"><div><div class="brand">AFTERDARK<span style="color:#00edff">.</span></div><div class="sub">BIOLUMINESCENT AQUARIUM</div></div><div class="status"><div>● SYSTEM ONLINE</div><div id="fps">FIELD STABLE</div></div></div><div class="bottom"><div class="label"><span>SWIM SPEED</span><span id="value">65%</span></div><input id="energy" type="range" min="10" max="100" value="65"><div class="label"><span>SWIMMING BEHAVIOUR</span><span id="mode">VORTEX</span></div><div class="row"><button class="active" data-mode="vortex">SCHOOL</button><button data-mode="orbit">CIRCLE</button><button data-mode="storm">FRENZY</button></div><div class="row"><button id="pulse">◉ RIPPLE</button><button id="palette">◈ COLOUR</button><button id="pause">Ⅱ PAUSE</button></div><div class="foot">HOMESTEAD EXPERIMENTAL // AQUARIUM EDITION</div></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),energyEl=document.getElementById('energy');
let w=0,h=0,dpr=1,fish=[],bubbles=[],mode='vortex',energy=.65,palette=0,paused=false,frame=0,ripples=[];
const themes=[{water:'#031522',fish:['#32e6ff','#86fff1','#ffd27b'],name:'DEEP REEF'},{water:'#1a0b25',fish:['#ff5caa','#c58bff','#ffe2a0'],name:'CORAL GLOW'},{water:'#061c16',fish:['#a8ff75','#4de5bf','#f3ffb3'],name:'EMERALD'}];
let pointer={x:0,y:0,down:false};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);fish=Array.from({length:55},(_,i)=>({x:Math.random()*w,y:Math.random()*h*.78,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,size:4+Math.random()*7,kind:i%3,phase:Math.random()*7}));bubbles=Array.from({length:32},()=>({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*3,s:.2+Math.random()*.65}))}
addEventListener('resize',resize);resize();
function splash(x,y,power=1){ripples.push({x,y,r:0,a:1,power});for(const f of fish){let dx=f.x-x,dy=f.y-y,d=Math.hypot(dx,dy)||1;if(d<230){let k=(1-d/230)*power*8;f.vx+=dx/d*k;f.vy+=dy/d*k}}}
c.addEventListener('pointerdown',e=>{pointer.down=true;pointer.x=e.clientX;pointer.y=e.clientY;splash(pointer.x,pointer.y,1.4)});
c.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;if(pointer.down&&frame%5===0)splash(pointer.x,pointer.y,.3)});
addEventListener('pointerup',()=>pointer.down=false);addEventListener('pointercancel',()=>pointer.down=false);
energyEl.oninput=e=>{energy=Number(e.target.value)/100;document.getElementById('value').textContent=e.target.value+'%'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.getElementById('mode').textContent=({vortex:'SCHOOL',orbit:'CIRCLE',storm:'FRENZY'})[mode];document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('mode').textContent='SCHOOL';
document.getElementById('pulse').onclick=()=>splash(w/2,h*.43,2.5);
document.getElementById('palette').onclick=()=>{palette=(palette+1)%themes.length;document.getElementById('palette').textContent='◈ '+themes[palette].name;document.body.style.background=themes[palette].water;ctx.fillStyle=themes[palette].water;ctx.fillRect(0,0,w,h)};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
function drawFish(f,col){const a=Math.atan2(f.vy,f.vx);ctx.save();ctx.translate(f.x,f.y);ctx.rotate(a);const z=f.size;ctx.shadowColor=col;ctx.shadowBlur=13;ctx.fillStyle=col;ctx.globalAlpha=.88;ctx.beginPath();ctx.ellipse(0,0,z*1.5,z*.65,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-z*1.1,0);ctx.lineTo(-z*2.15,-z*.85);ctx.lineTo(-z*2.15,z*.85);ctx.closePath();ctx.fill();ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(-z*.2,-z*.25);ctx.lineTo(-z*.7,-z*1.05);ctx.lineTo(z*.5,-z*.35);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle='#04121b';ctx.beginPath();ctx.arc(z*.85,-z*.16,Math.max(1,z*.13),0,Math.PI*2);ctx.fill();ctx.restore()}
function tick(){requestAnimationFrame(tick);if(paused)return;frame++;const theme=themes[palette];ctx.fillStyle=theme.water;ctx.fillRect(0,0,w,h);const cx=w/2,cy=h*.43;
let glow=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(w,h)*.8);glow.addColorStop(0,'#1a7d9a24');glow.addColorStop(1,'#00000000');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
for(const b of bubbles){b.y-=b.s*(.5+energy);b.x+=Math.sin(frame*.013+b.y*.03)*.2;if(b.y<0){b.y=h;b.x=Math.random()*w}ctx.strokeStyle='#83eaff38';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke()}
for(let i=0;i<fish.length;i++){let f=fish[i],ax=0,ay=0,neighbors=0,avgx=0,avgy=0,alignx=0,aligny=0,sepX=0,sepY=0;
for(let j=0;j<fish.length;j++){if(i===j)continue;const g=fish[j],dx=g.x-f.x,dy=g.y-f.y,d2=dx*dx+dy*dy;if(d2<8500){neighbors++;avgx+=g.x;avgy+=g.y;alignx+=g.vx;aligny+=g.vy;if(d2<500&&d2>1){sepX-=dx/d2*20;sepY-=dy/d2*20}}}
if(neighbors){ax+=(avgx/neighbors-f.x)*.0006+(alignx/neighbors-f.vx)*.012+sepX*.035;ay+=(avgy/neighbors-f.y)*.0006+(aligny/neighbors-f.vy)*.012+sepY*.035}
if(mode==='orbit'){let dx=f.x-cx,dy=f.y-cy,d=Math.hypot(dx,dy)+1;ax+=-dy/d*.12+(cx-f.x)*.00015;ay+=dx/d*.12+(cy-f.y)*.00015}
else if(mode==='storm'){ax+=Math.sin(frame*.09+f.phase)*.21;ay+=Math.cos(frame*.075+f.phase)*.19}
else{ax+=Math.sin(frame*.007+f.phase)*.022;ay+=Math.cos(frame*.008+f.phase)*.019}
ax+=(w/2-f.x)*.00008;ay+=(h*.38-f.y)*.00009;
f.vx=(f.vx+ax)*.985;f.vy=(f.vy+ay)*.985;let speed=Math.hypot(f.vx,f.vy),max=.7+energy*2.8+(mode==='storm'?1.8:0);if(speed<.35){f.vx+=Math.cos(f.phase)*.09;f.vy+=Math.sin(f.phase)*.09}if(speed>max){f.vx*=max/speed;f.vy*=max/speed}f.x+=f.vx;f.y+=f.vy;if(f.x< -25)f.x=w+20;if(f.x>w+25)f.x=-20;if(f.y< -25)f.y=h+20;if(f.y>h+25)f.y=-20;drawFish(f,theme.fish[f.kind])}
for(const r of ripples){ctx.strokeStyle='rgba(115,235,255,'+r.a*.8+')';ctx.lineWidth=2.5*r.a;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();r.r+=5*r.power;r.a-=.018}ripples=ripples.filter(r=>r.a>0);
if(frame%60===0)document.getElementById('fps').textContent=fish.length+' LIVE FISH'}
tick();
</script></body></html>
