</style></head><body><div id="notice"></div><div id="ui"><div class="head"><div><div class="brand">AFTERDARK</div><div class="sub">LIVING KOI · 3D AQUARIUM</div></div><div class="tag">FOUR INDIVIDUAL KOI<br>OFFLINE EDITION 05</div></div><div class="panel"><div class="label"><span>SWIMMING SPEED</span><span id="value">65%</span></div><input id="speed" type="range" min="0" max="100" value="65"><div class="row"><button data-mode="cruise" class="active">CRUISE</button><button data-mode="school">SCHOOL</button><button data-mode="explore">EXPLORE</button></div><div class="row"><button id="feed">◉ FEED</button><button id="light">◈ LIGHT</button><button id="pause">Ⅱ PAUSE</button></div><div id="foot">TAP GLASS TO ATTRACT · SWIPE TO STARTLE</div></div></div><button id="toggle" aria-label="Toggle immersive view">⛶</button><script src="three.min.js"></script><script>
(function(){
'use strict';
const notice=document.getElementById('notice');

const T=THREE,renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new T.Scene();scene.background=new T.Color(0x061923);scene.fog=new T.FogExp2(0x123b43,.025);
const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,.25,21);camera.lookAt(0,0,0);

const box=new T.Group();scene.add(box);
function mat(color,rough=.68,metal=0){return new T.MeshStandardMaterial({color,roughness:rough,metalness:metal,side:T.DoubleSide})}
const floor=new T.Mesh(new T.PlaneGeometry(18,9),mat(0x60796d,.95));floor.rotation.x=-Math.PI/2;floor.position.y=-3.45;box.add(floor);
const rear=new T.Mesh(new T.PlaneGeometry(18,7),mat(0x17434a,.9));rear.position.z=-4.15;box.add(rear);
const top=new T.Mesh(new T.PlaneGeometry(18,9),new T.MeshBasicMaterial({color:0x6de5e9,transparent:true,opacity:.1,side:T.DoubleSide}));top.rotation.x=Math.PI/2;top.position.y=3.55;box.add(top);
const glassMat=new T.MeshPhysicalMaterial({color:0xb7e7e6,transparent:true,opacity:.075,roughness:.08,metalness:.08,side:T.DoubleSide,depthWrite:false});
for(let x of [-8.9,8.9]){let wall=new T.Mesh(new T.PlaneGeometry(8.3,7),glassMat);wall.rotation.y=Math.PI/2;wall.position.x=x;box.add(wall)}
const edgeMat=mat(0x11292c,.35,.35);for(let x of [-8.9,8.9])for(let y of [-3.5,3.5]){let edge=new T.Mesh(new T.BoxGeometry(.09,.09,8.5),edgeMat);edge.position.set(x,y,0);box.add(edge)}
let seed=13;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const stoneMats=[mat(0x52615a),mat(0x87918a),mat(0x3b514e),mat(0x9d9c8b)];
for(let i=0;i<95;i++){const rock=new T.Mesh(new T.IcosahedronGeometry(.12+random()*.37,0),stoneMats[i%4]);rock.position.set((random()-.5)*17,-3.4+(random()*.1),(random()-.5)*7.8);rock.scale.set(1.5+random(),.35+random()*.55,1+random());rock.rotation.set(random()*3,random()*3,random()*3);box.add(rock)}
const plants=[];for(let i=0;i<28;i++){let root=new T.Group();root.position.set((random()-.5)*17,-3.4,-3.1+random()*6);let stalk=mat(i%2?0x3d7d65:0x518c5f,.8);for(let j=0;j<3;j++){let blade=new T.Mesh(new T.CylinderGeometry(.012,.075,1+random()*2.1,5,7),stalk);blade.position.set((j-1)*.17,.7,0);blade.rotation.z=(j-1)*.24;root.add(blade)}box.add(root);plants.push(root)}
// Animated moving caustics projected onto the substrate and back wall.
const causticCanvas=document.createElement('canvas');causticCanvas.width=256;causticCanvas.height=256;const cc=causticCanvas.getContext('2d'),tex=new T.CanvasTexture(causticCanvas);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(2,2);
const caustics=new T.Mesh(new T.PlaneGeometry(17.6,8),new T.MeshBasicMaterial({map:tex,transparent:true,opacity:.18,depthWrite:false,blending:T.AdditiveBlending}));caustics.rotation.x=-Math.PI/2;caustics.position.y=-3.42;box.add(caustics);
const colors=[{base:0xf2e9d8,red:0xc72d17,black:0x202325},{base:0xf6f0df,red:0xd65c1c,black:0x1c2424},{base:0xeceae3,red:0x171f21,black:0xc84726},{base:0xd5b778,red:0xe8d2a4,black:0x6e542d}];
function koi(index){
const pattern=colors[index],root=new T.Group(),body=new T.Group();root.add(body);
const nx=28,ns=20,verts=[],cols=[],indices=[];const base=new T.Color(pattern.base),red=new T.Color(pattern.red),black=new T.Color(pattern.black);
const spots=Array.from({length:9},()=>({x:-.8+random()*2.6,a:random()*6.28,r:.2+random()*.4,dark:random()<.23}));
for(let i=0;i<=nx;i++){const u=i/nx,x=-1.65+u*3.6,profile=Math.pow(Math.max(.002,Math.sin(Math.PI*u)),.75),thick=.38*profile,high=.53*profile;
for(let j=0;j<=ns;j++){let a=j/ns*Math.PI*2,yy=Math.cos(a)*high,zz=Math.sin(a)*thick;verts.push(x,yy,zz);
let shade=base.clone();for(const p of spots){let dx=(x-p.x)/p.r,da=Math.atan2(Math.sin(a-p.a),Math.cos(a-p.a))*1.2/p.r;if(dx*dx+da*da<1.0)shade.copy(p.dark?black:red)}
shade.multiplyScalar(.91+.12*Math.cos(a));cols.push(shade.r,shade.g,shade.b)}}
for(let i=0;i<nx;i++)for(let j=0;j<ns;j++){let a=i*(ns+1)+j,b=a+ns+1;indices.push(a,b,a+1,b,b+1,a+1)}
let geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setAttribute('color',new T.Float32BufferAttribute(cols,3));geo.setIndex(indices);geo.computeVertexNormals();
let bodyMat=new T.MeshPhysicalMaterial({vertexColors:true,roughness:.29,metalness:.04,clearcoat:.65,clearcoatRoughness:.2,side:T.DoubleSide});body.add(new T.Mesh(geo,bodyMat));
const finMat=new T.MeshPhysicalMaterial({color:pattern.base,transparent:true,opacity:.87,roughness:.38,side:T.DoubleSide});
function fin(shape,parent){let g=new T.Shape();g.moveTo(...shape[0]);for(let i=1;i<shape.length;i++)g.lineTo(...shape[i]);g.closePath();let mesh=new T.Mesh(new T.ShapeGeometry(g),finMat);parent.add(mesh);return mesh}
let tailPivot=new T.Group();tailPivot.position.x=-1.65;body.add(tailPivot);let tail=fin([[0,0],[-.68,.65],[-.45,0],[-.68,-.65]],tailPivot);
let dorsal=fin([[-.9,.15],[-.45,.72],[.65,.34]],body);dorsal.position.z=-.06;
let leftFin=fin([[.45,0],[-.4,-.68],[-.18,.05]],body);leftFin.position.set(.25,-.23,.35);leftFin.rotation.y=.4;
let rightFin=fin([[.45,0],[-.4,-.68],[-.18,.05]],body);rightFin.position.set(.25,-.23,-.35);rightFin.rotation.y=-.4;
for(let side of [-1,1]){let eye=new T.Mesh(new T.SphereGeometry(.063,12,10),mat(0x131b1d,.14));eye.position.set(1.24,.16,side*.235);body.add(eye);let glint=new T.Mesh(new T.SphereGeometry(.018,8,6),new T.MeshBasicMaterial({color:0xffffff}));glint.position.set(1.27,.18,side*.29);body.add(glint)}
let mouth=new T.Mesh(new T.TorusGeometry(.085,.023,6,14),mat(0x9f7967,.55));mouth.position.set(1.87,-.04,0);mouth.rotation.y=Math.PI/2;body.add(mouth);
root.position.set(-4+index*2.6,(index%2)*1.2-1,-1.5+index*.7);root.scale.setScalar(.72+index*.045);scene.add(root);
return {root,body,tailPivot,leftFin,rightFin,velocity:new T.Vector3(index%2?-.7:.7,.05,(index-2)*.1),desired:new T.Vector3(),target:new T.Vector3(random()*10-5,random()*4-2,random()*5-2.5),phase:index*1.9,boost:0,individual:index}}
const koiFish=Array.from({length:4},(_,i)=>koi(i));
let speed=.65,mode='cruise',lightMode=0,paused=false,frame=0,interaction=null,lastTap=0;
function pointFromTouch(e){let rect=renderer.domElement.getBoundingClientRect(),p=new T.Vector3((e.clientX/rect.width)*2-1,-(e.clientY/rect.height)*2+1,.5);p.unproject(camera);let dir=p.sub(camera.position).normalize(),dist=(0-camera.position.z)/dir.z;return camera.position.clone().addScaledVector(dir,dist)}
renderer.domElement.addEventListener('pointerdown',e=>{interaction={point:pointFromTouch(e),start:performance.now(),drag:false};lastTap=performance.now()});
renderer.domElement.addEventListener('pointermove',e=>{if(interaction){interaction.point.copy(pointFromTouch(e));interaction.drag=true}});
renderer.domElement.addEventListener('pointerup',()=>{if(interaction&&!interaction.drag){for(const f of koiFish){f.target.copy(interaction.point);f.target.z=clamp(f.root.position.z,-2,2)}}interaction=null});
document.getElementById('speed').oninput=e=>{speed=Number(e.target.value)/100;document.getElementById('value').textContent=e.target.value+'%'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('feed').onclick=()=>{interaction={point:new T.Vector3((random()-.5)*6,1.4,1),start:performance.now(),drag:false};setTimeout(()=>{interaction=null},1700)};
document.getElementById('light').onclick=()=>{lightMode=(lightMode+1)%3;const options=[0x061923,0x142a40,0x12251c];scene.background.setHex(options[lightMode]);hemi.intensity=[2.1,1.5,2.6][lightMode];sun.intensity=[2.3,1.1,3.1][lightMode]};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
document.getElementById('toggle').onclick=()=>{document.body.classList.toggle('clean');document.getElementById('toggle').textContent=document.body.classList.contains('clean')?'⊞':'⛶'};
function animate(){requestAnimationFrame(animate);if(paused)return;frame++;let t=frame/60;
for(let i=0;i<koiFish.length;i++){let f=koiFish[i],pos=f.root.position;let to=f.target.clone().sub(pos);if(to.length()<.65||frame%(220+i*37)===0){f.target.set((random()-.5)*12,-2+random()*4.5,-2.7+random()*5.4);to.copy(f.target).sub(pos)}
let steer=to.normalize().multiplyScalar(.012);
if(mode==='school'){let center=new T.Vector3();for(const other of koiFish)if(other!==f)center.add(other.root.position);center.multiplyScalar(1/3);steer.add(center.sub(pos).multiplyScalar(.002))}
if(mode==='explore')steer.add(new T.Vector3(Math.sin(t*.4+f.phase)*.007,Math.cos(t*.27+f.phase)*.005,Math.sin(t*.32+f.phase)*.007));
for(const other of koiFish){if(other===f)continue;let away=pos.clone().sub(other.root.position),d=away.length();if(d<1.9&&d>.001)steer.addScaledVector(away.normalize(),(1.9-d)*.024)}
// Soft wall repulsion acts BEFORE contact, avoiding bouncing and corner traps.
for(const [axis,limit] of [['x',6.6],['y',2.45],['z',2.65]]){let p=pos[axis],edge=Math.abs(p);if(edge>limit-1.4)steer[axis]-=Math.sign(p)*Math.pow((edge-(limit-1.4))/1.4,2)*.07}
if(interaction){let delta=interaction.point.clone().sub(pos),d=delta.length();if(interaction.drag){if(d<3.5&&d>.01)steer.addScaledVector(delta.normalize(),-.11*(1-d/3.5));f.boost=Math.max(f.boost,.8)}else{if(d>1.1)steer.addScaledVector(delta.normalize(),.015);f.boost=Math.max(f.boost,.2)}}
f.velocity.add(steer);let base=.16+speed*.85,maximum=base*(1+f.boost*1.2);let mag=f.velocity.length();if(mag>maximum)f.velocity.multiplyScalar(maximum/mag);if(mag<base*.48)f.velocity.setLength(base*.48);
pos.addScaledVector(f.velocity,.075);f.boost*=.974;
if(Math.abs(pos.x)>7.2||Math.abs(pos.y)>2.9||Math.abs(pos.z)>3.1){pos.x=clamp(pos.x,-7.2,7.2);pos.y=clamp(pos.y,-2.9,2.9);pos.z=clamp(pos.z,-3.1,3.1);f.target.set(-pos.x*.5,-pos.y*.5,-pos.z*.5);f.velocity.lerp(f.target.clone().sub(pos).normalize().multiplyScalar(base),.16)}
// Fish's nose points along +X, with eased rotation instead of snapping.
let heading=Math.atan2(-f.velocity.z,f.velocity.x),pitch=Math.atan2(f.velocity.y,Math.hypot(f.velocity.x,f.velocity.z));let difference=Math.atan2(Math.sin(heading-f.root.rotation.y),Math.cos(heading-f.root.rotation.y));f.root.rotation.y+=difference*.045;f.root.rotation.z+=(pitch-f.root.rotation.z)*.045;
let wag=Math.sin(t*(5+speed*7)+f.phase);f.tailPivot.rotation.y=wag*(.22+f.boost*.25);f.leftFin.rotation.x=wag*.15;f.rightFin.rotation.x=-wag*.15;f.body.rotation.z=Math.sin(t*2.4+f.phase)*.013;
}
if(frame%4===0){cc.clearRect(0,0,256,256);cc.strokeStyle='rgba(185,255,246,.18)';for(let i=0;i<45;i++){let x=(i*79+Math.sin(t*.4+i)*24)%256,y=(i*41+Math.cos(t*.45+i)*19)%256;cc.lineWidth=1+Math.sin(i)*.6;cc.beginPath();cc.ellipse(x,y,15,7,i,0,7);cc.stroke()}tex.needsUpdate=true}
top.position.y=3.55+Math.sin(t*.9)*.02;for(let i=0;i<plants.length;i++)plants[i].rotation.z=Math.sin(t*.8+i)*.035;
renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<innerHeight?27:21;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();animate();
})();
</script></body></html>
