<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914;color:#d7faff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none;padding:25px 20px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:start}.brand{font-size:24px;font-weight:900;letter-spacing:5px;text-shadow:0 0 25px #00dfff}.sub{font-size:10px;letter-spacing:3px;color:#6f9baa;margin-top:6px}.status{font:11px monospace;color:#8bf9d3;text-align:right}.bottom{pointer-events:auto;background:linear-gradient(180deg,#091728dd,#050d18f5);border:1px solid #28536a;border-radius:18px;padding:15px;box-shadow:0 0 35px #00bfff19}.row{display:flex;gap:8px;margin-top:12px}button{flex:1;border:1px solid #30667a;background:#0a2334;color:#aeeeff;border-radius:9px;padding:13px 4px;font-size:11px;letter-spacing:1px;font-weight:bold}button.active{background:#00bcd4;color:#02131b;box-shadow:0 0 18px #00bcd488}.label{font-size:11px;letter-spacing:2px;color:#85b4c3;display:flex;justify-content:space-between}input{width:100%;accent-color:#00e5ff;margin:14px 0 5px}.foot{font:10px monospace;color:#608b9a;text-align:center;margin-top:10px}#hint{position:absolute;top:48%;width:100%;text-align:center;color:#6b9aab;letter-spacing:3px;font-size:10px;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div id="hint">TOUCH TO DISTURB THE FIELD</div><div class="hud"><div class="top"><div><div class="brand">AFTERDARK<span style="color:#00edff">.</span></div><div class="sub">REACTIVE PARTICLE ENGINE</div></div><div class="status"><div>● SYSTEM ONLINE</div><div id="fps">FIELD STABLE</div></div></div><div class="bottom"><div class="label"><span>ENERGY OUTPUT</span><span id="value">65%</span></div><input id="energy" type="range" min="10" max="100" value="65"><div class="label"><span>FIELD CONFIGURATION</span><span id="mode">VORTEX</span></div><div class="row"><button class="active" data-mode="vortex">VORTEX</button><button data-mode="orbit">ORBIT</button><button data-mode="storm">STORM</button></div><div class="row"><button id="pulse">⚡ PULSE</button><button id="palette">◈ COLOUR</button><button id="pause">Ⅱ PAUSE</button></div><div class="foot">HOMESTEAD EXPERIMENTAL // OFFLINE EDITION 01</div></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let w,h,dpr,particles=[],mode='vortex',energy=.65,palette=0,paused=false,frame=0,pointer={x:0,y:0,on:false},shock=0;
const colors=[['#00e5ff','#79fff0','#ffc66a'],['#ff3c85','#fca3ff','#f8c66c'],['#91ff62','#eaff91','#00bfb5']];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(280,Math.floor(w*h/1300));particles=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,r:Math.random()*1.7+.5,phase:Math.random()*6.28,seed:Math.random()}))}
addEventListener('resize',resize);resize();
function pos(e){const t=e.touches?e.touches[0]:e;pointer.x=t.clientX;pointer.y=t.clientY}c.addEventListener('pointerdown',e=>{pos(e);pointer.on=true;shock=1});c.addEventListener('pointermove',e=>{pos(e)});addEventListener('pointerup',()=>pointer.on=false);
document.getElementById('energy').oninput=e=>{energy=e.target.value/100;document.getElementById('value').textContent=e.target.value+'%'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.getElementById('mode').textContent=mode.toUpperCase();document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('pulse').onclick=()=>{shock=1;pointer.x=w/2;pointer.y=h*.44};
document.getElementById('palette').onclick=()=>palette=(palette+1)%colors.length;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
function tick(){requestAnimationFrame(tick);if(paused)return;frame++;ctx.fillStyle='rgba(3,9,20,.19)';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h*.43;ctx.save();ctx.globalCompositeOperation='lighter';const cs=colors[palette];for(let i=0;i<particles.length;i++){let p=particles[i],dx=p.x-cx,dy=p.y-cy,dist=Math.hypot(dx,dy)+1;let ax=0,ay=0;
if(mode==='vortex'){let force=(.09+energy*.24)*Math.min(2,180/dist);ax=-dy/dist*force+(cx-p.x)*.00014;ay=dx/dist*force+(cy-p.y)*.00014}
else if(mode==='orbit'){const target=60+p.seed*Math.min(w,h)*.48;let radial=(target-dist)*.0009;ax=dx/dist*radial-dy/dist*.12*energy;ay=dy/dist*radial+dx/dist*.12*energy}
else{ax=(Math.sin(frame*.013+p.phase*4+p.y*.014))*.12*energy;ay=(Math.cos(frame*.011+p.phase*3+p.x*.009))*.13*energy}
let pdx=p.x-pointer.x,pdy=p.y-pointer.y,dd=Math.hypot(pdx,pdy)+1;if((pointer.on||shock>.01)&&dd<190){let f=(1-dd/190)*(pointer.on?1.9:shock*3)*energy;ax+=pdx/dd*f;ay+=pdy/dd*f}
p.vx=(p.vx+ax)*.984;p.vy=(p.vy+ay)*.984;let speed=Math.hypot(p.vx,p.vy),limit=1.2+energy*4;if(speed>limit){p.vx*=limit/speed;p.vy*=limit/speed}p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x+=w;if(p.x>w)p.x-=w;if(p.y<0)p.y+=h;if(p.y>h)p.y-=h;
ctx.fillStyle=cs[i%3];ctx.globalAlpha=.3+p.seed*.65;ctx.shadowBlur=12;ctx.shadowColor=cs[i%3];ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.7+energy*.5),0,Math.PI*2);ctx.fill();if(i%5===0){ctx.strokeStyle=cs[i%3];ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*5,p.y-p.vy*5);ctx.stroke()}}
ctx.restore();shock*=.93;if(frame%60===0)document.getElementById('fps').textContent=particles.length+' ACTIVE NODES'}tick();
</script></body></html>
