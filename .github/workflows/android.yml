name: Build AFTERDARK APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline 3D renderer
        run: |
          npm pack three@0.149.0 --silent
          tar -xzf three-0.149.0.tgz package/build/three.min.js
          cp package/build/three.min.js app/src/main/assets/three.min.js
          test -s app/src/main/assets/three.min.js
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AFTERDARK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk